name:  x86_64 ARCVM SukiSU Kernel Build
on:
  push:
    branches: ["main", "ci", "checkci"]
    paths:
      - ".github/workflows/build-kernel-arcvm.yml"
      - "kernel/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-kernel-arcvm.yml"
      - "kernel/**"
  workflow_call:
  workflow_dispatch:

env:
  git_tag: chromeos-5.10-arcvm
  version_tag: v1.2.0-sukisu-enhanced

jobs:
  build:
    if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    strategy:
      matrix:
        include:
          - arch: x86_64
            kernel_image_name: bzImage
            build_config: build.config.gki.x86_64
            defconfig: x86_64_arcvm_defconfig
          # Comment out arm64 for now to focus on fixing x86_64
          # - arch: arm64
          #   kernel_image_name: Image
          #   build_config: build.config.gki.aarch64
          #   defconfig: arm64_arcvm_defconfig

    name: Build ChromeOS ARCVM kernel
    runs-on: ubuntu-22.04
    env:
      LTO: thin
      ROOT_DIR: /
      KERNEL_DIR: ${{ github.workspace }}/kernel

    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc \
              bison build-essential ca-certificates flex git gnupg \
              libelf-dev libssl-dev lsb-release software-properties-common wget \
              libncurses-dev binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu nuget gzip \
              rsync python3 device-tree-compiler ccache
          sudo ln -s --force python3 /usr/bin/python
          export LLVM_VERSION=14
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh $LLVM_VERSION
          rm ./llvm.sh
          sudo ln -s --force /usr/bin/clang-$LLVM_VERSION /usr/bin/clang
          sudo ln -s --force /usr/bin/ld.lld-$LLVM_VERSION /usr/bin/ld.lld
          sudo ln -s --force /usr/bin/llvm-objdump-$LLVM_VERSION /usr/bin/llvm-objdump
          sudo ln -s --force /usr/bin/llvm-ar-$LLVM_VERSION /usr/bin/llvm-ar
          sudo ln -s --force /usr/bin/llvm-nm-$LLVM_VERSION /usr/bin/llvm-nm
          sudo ln -s --force /usr/bin/llvm-strip-$LLVM_VERSION /usr/bin/llvm-strip
          sudo ln -s --force /usr/bin/llvm-objcopy-$LLVM_VERSION /usr/bin/llvm-objcopy
          sudo ln -s --force /usr/bin/llvm-readelf-$LLVM_VERSION /usr/bin/llvm-readelf
          sudo ln -s --force /usr/bin/clang++-$LLVM_VERSION /usr/bin/clang++
      # Important: Check out both the main repo AND KernelSU in one step for proper linking
      - name: Checkout Repositories
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout KernelSU
        uses: actions/checkout@v5
        with:
          repository: tiann/KernelSU
          path: KernelSU
          fetch-depth: 0

      - name: Setup kernel source
        run: |
          git clone https://chromium.googlesource.com/chromiumos/third_party/kernel.git -b ${{ env.git_tag }} --depth=1
          # Create required directories
          mkdir -p $KERNEL_DIR/drivers/kernelsu
          
          # Debug output to verify directory structure
          echo "Directory structure:"
          ls -la
          echo "KernelSU contents:"
          ls -la KernelSU
      - name: Extract version from Makefile
        working-directory: kernel
        run: |
          VERSION=$(grep -E '^VERSION = ' Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -E '^PATCHLEVEL = ' Makefile | awk '{print $3}')
          SUBLEVEL=$(grep -E '^SUBLEVEL = ' Makefile | awk '{print $3}')
          echo "ChromeOS ARCVM Linux kernel version: $VERSION.$PATCHLEVEL.$SUBLEVEL"
          echo "version=$VERSION.$PATCHLEVEL.$SUBLEVEL" >> $GITHUB_ENV
      - name: Setup KernelSU
        run: |
          echo "[+] KernelSU setup"
          KERNEL_ROOT=$GITHUB_WORKSPACE/kernel
          echo "[+] KERNEL_ROOT: $KERNEL_ROOT"
          echo "[+] KernelSU path: $GITHUB_WORKSPACE/KernelSU"
          
          # Debug output
          echo "Checking KernelSU structure:"
          find $GITHUB_WORKSPACE/KernelSU -type d | sort
          
          echo "[+] Copy KernelSU driver to $KERNEL_ROOT/drivers/kernelsu"
          # First make sure the kernelsu directory exists in the KernelSU repo
          if [ -d "$GITHUB_WORKSPACE/KernelSU/kernel" ]; then
            cp -r $GITHUB_WORKSPACE/KernelSU/kernel/* $KERNEL_ROOT/drivers/kernelsu/
          else
            echo "[!] ERROR: KernelSU kernel directory not found!"
            exit 1
          fi
          
          echo "[+] Add KernelSU driver to Makefile"
          DRIVER_MAKEFILE=$KERNEL_ROOT/drivers/Makefile
          DRIVER_KCONFIG=$KERNEL_ROOT/drivers/Kconfig
          
          echo "[+] Check existence of destination files"
          ls -la $DRIVER_MAKEFILE $DRIVER_KCONFIG
          
          grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
          grep -q "kernelsu" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"
          
          echo "[+] Verify Kconfig file exists"
          ls -la $KERNEL_ROOT/drivers/kernelsu/Kconfig
          
          echo "[+] Apply KernelSU patches"
          cd $KERNEL_ROOT && git apply $GITHUB_WORKSPACE/KernelSU/.github/patches/5.10/*.patch || echo "[-] No patch found"
          echo "[+] Patch script/setlocalversion"
          sed -i 's/-dirty//g' $KERNEL_ROOT/scripts/setlocalversion
          echo "[+] KernelSU setup done."
          cd $GITHUB_WORKSPACE/KernelSU
          KSU_VERSION=$(($(git rev-list --count HEAD) + 10200))
          echo "KernelSU version: $KSU_VERSION"
          echo "kernelsu_version=$KSU_VERSION" >> $GITHUB_ENV


      - name: Inject SukiSU KPM Module
        run: |
          # Clone the SukiSU-Ultra repository to get the KPM module
          echo "Cloning SukiSU-Ultra repository..."
          git clone --depth 1 -b susfs-main https://github.com/SukiSU-Ultra/SukiSU-Ultra.git SukiSU-Ultra
          
          # Copy the kpm directory into the kernel source's kernelsu driver directory
          echo "Copying KPM module to kernel drivers..."
          cp -r SukiSU-Ultra/kernel/kpm $KERNEL_DIR/drivers/kernelsu/
          
          # Verify that the kpm directory was copied successfully
          echo "Verifying KPM module copy..."
          ls -la $KERNEL_DIR/drivers/kernelsu/kpm
          
          # Clean up by removing the cloned repository
          rm -rf SukiSU-Ultra
          
          
      # overwrite the default kernelSU Kconfig settings 'kernel/drivers/kernelsu/Kconfig'
      - name: Overwrite Default KernelSU Kconfig Settings
        working-directory: kernel
        run: |
          cat > $KERNEL_DIR/drivers/kernelsu/Kconfig << "EOF"
          menu "KernelSU"

          config KSU
                tristate "KernelSU function support"
                default y
                help
                  Enable kernel-level root privileges on Android System.
                  To compile as a module, choose M here: the
                  module will be called kernelsu.

          config KSU_DEBUG
                bool "KernelSU debug mode"
                depends on KSU
                default y
                help
                  Enable KernelSU debug mode.

          config KSU_MULTI_MANAGER_SUPPORT
              bool "Multi KernelSU manager support"
              depends on KSU
              default y
              help
                  Enable multi KernelSU manager support


          config KSU_ALLOWLIST_WORKAROUND
              bool "KernelSU Session Keyring Init workaround"
              depends on KSU
              default n
              help
                Enable session keyring init workaround for problematic devices.
                Useful for situations where the SU allowlist is not kept after a reboot

          config KPM
                bool "Enable SukiSU KPM"
                depends on KSU && 64BIT
                select KALLSYMS
                select KALLSYMS_ALL
                default y
                help
                  Enabling this option will activate the KPM feature of SukiSU.
                  This option is suitable for scenarios where you need to force KPM to be enabled.
                  but it may affect system stability.

          config KSU_MANUAL_HOOK
              bool "Hook KernelSU manually"
              depends on KSU != m
              help
                If enabled, Hook required KernelSU syscalls with manually-patched function.

          menu "KernelSU - SUSFS"

          config KSU_SUSFS
          	bool "KernelSU addon - SUSFS"
          	depends on KSU
          	depends on THREAD_INFO_IN_TASK
          	default y
          	help
          		Patch and Enable SUSFS to kernel with KernelSU.

          config KSU_SUSFS_SUS_PATH
          	bool "Enable to hide suspicious path (NOT recommended)"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow hiding the user-defined path and all its sub-paths from various system calls.
          		- Includes temp fix for the leaks of app path in /sdcard/Android/data directory.
          		- Effective only on zygote spawned user app process.
          		- Use with cautious as it may cause performance loss and will be vulnerable to side channel attacks,
          		  just disable this feature if it doesn't work for you or you don't need it at all.

          config KSU_SUSFS_SUS_MOUNT
          	bool "Enable to hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow hiding the user-defined mount paths from /proc/self/[mounts|mountinfo|mountstat].
          		- Effective on all processes for hiding mount entries.
          		- Mounts mounted by process with ksu domain will be forced to be assigned the dev name "KSU".
          		- mnt_id and mnt_group_id of the sus mount will be assigned to a much bigger number to solve the issue of id not being contiguous.

          config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          	bool "Enable to hide KSU's default mounts automatically (experimental)"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default y
          	help
          		- Automatically add KSU's default mounts to sus_mount.
          		- No susfs command is needed in userspace.
          		- Only mount operation from process with ksu domain will be checked.

          config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          	bool "Enable to hide suspicious bind mounts automatically (experimental)"
          	depends on KSU_SUSFS_SUS_MOUNT
          	default y
          	help
          		- Automatically add binded mounts to sus_mount.
          		- No susfs command is needed in userspace.
          		- Only mount operation from process with ksu domain will be checked.

          config KSU_SUSFS_SUS_KSTAT
          	bool "Enable to spoof suspicious kstat"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow spoofing the kstat of user-defined file/directory.
          		- Effective only on zygote spawned user app process.

          config KSU_SUSFS_TRY_UMOUNT
          	bool "Enable to use ksu's try_umount"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow using try_umount to umount other user-defined mount paths prior to ksu's default umount paths.
          		- Effective on all NO-root-access-granted processes.

          config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
          	bool "Enable to add bind mounts to ksu's try_umount automatically (experimental)"
          	depends on KSU_SUSFS_TRY_UMOUNT
          	default y
          	help
          		- Automatically add binded mounts to ksu's try_umount.
          		- No susfs command is needed in userspace.
          		- Only mount operation from process with ksu domain will be checked.

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Enable to spoof uname"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow spoofing the string returned by uname syscall to user-defined string.
          		- Effective on all processes.

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable logging susfs log to kernel"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow logging susfs log to kernel, uncheck it to completely disable all susfs log.

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Enable to automatically hide ksu and susfs symbols from /proc/kallsyms"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Automatically hide ksu and susfs symbols from '/proc/kallsyms'.
          		- Effective on all processes.

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Enable to spoof /proc/bootconfig (gki) or /proc/cmdline (non-gki)"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Spoof the output of /proc/bootconfig (gki) or /proc/cmdline (non-gki) with a user-defined file.
          		- Effective on all processes.

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable to redirect a path to be opened with another path (experimental)"
          	depends on KSU_SUSFS
          	default n
          	help
          		- Allow redirecting a target path to be opened with another user-defined path.
          		- Effective only on processes with uid < 2000.
          		- Please be reminded that process with open access to the target and redirected path can be detected.

          config KSU_SUSFS_SUS_MAP
          	bool "Enable to hide some mmapped real file from different proc maps interfaces"
          	depends on KSU_SUSFS
          	default y
          	help
          		- Allow hiding mmapped real file from /proc/<pid>/[maps|smaps|smaps_rollup|map_files|mem|pagemap]
          		- It does NOT support hiding for anon memory.
          		- It does NOT hide any inline hooks or plt hooks cause by the injected library itself.
          		- It may not be able to evade detections by apps that implement a good injection detection.
          		- Effective only on zygote spawned umounted user app process.

          endmenu

          endmenu
          EOF
           

      - name: Verify KernelSU files
        run: |
          echo "Checking if KernelSU Kconfig exists:"
          ls -la $KERNEL_DIR/drivers/kernelsu/
          echo "Contents of drivers directory:"
          ls -la $KERNEL_DIR/drivers/
          
          # Check if the file was included in Makefile
          echo "Checking if kernelsu is included in drivers/Makefile:"
          grep -n kernelsu $KERNEL_DIR/drivers/Makefile
          
          # Check if the file was included in Kconfig
          echo "Checking if kernelsu is included in drivers/Kconfig:"
          grep -n kernelsu $KERNEL_DIR/drivers/Kconfig
      - name: Apply SUSFS Patches
        run: |
          # Clone required repositories
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.10 $GITHUB_WORKSPACE/susfs
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git $GITHUB_WORKSPACE/SukiSU_patch
          
          cd $KERNEL_DIR
          # Apply SUSFS patch
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch .
          patch -p1 < 50_add_susfs_in_gki-android13-5.10.patch || true
          
          # Apply SukiSU patches
          cp $GITHUB_WORKSPACE/SukiSU_patch/69_hide_stuff.patch .
          patch -p1 -F3 < 69_hide_stuff.patch || true
          cp $GITHUB_WORKSPACE/SukiSU_patch/hooks/syscall_hooks.patch .
          patch -p1 -F3 < syscall_hooks.patch || true
          
          # Apply ZRAM LZ4KD patches if needed
          if [[ "${{ github.event.inputs.ZRAM_LZ4KD }}" == "true" ]]; then
            cp -r $GITHUB_WORKSPACE/SukiSU_patch/other/zram/lz4k/* .
            cp $GITHUB_WORKSPACE/SukiSU_patch/other/zram/zram_patch/5.10/lz4kd.patch . && patch -p1 < lz4kd.patch || true
          fi
          
          git status --short
      - name: Add missing SUSFS header files
        run: |
          # Ensure kernel source include directory exists
          mkdir -p $KERNEL_DIR/include/linux
          
          # Directly download the headers from the repo
          echo "Downloading SUSFS headers from GitLab..."
          wget -O "$KERNEL_DIR/include/linux/susfs_def.h" "https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.10/kernel_patches/include/linux/susfs_def.h"
          wget -O "$KERNEL_DIR/include/linux/susfs.h" "https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.10/kernel_patches/include/linux/susfs.h"
          wget -O "$KERNEL_DIR/include/linux/sus_su.h" "https://github.com/KaliRootSuperUser/SUSFS4KSU-ARCVM/blob/main/kernel_patches/include/linux/sus_su.h"
          
          # Also copy from local clone as backup
          if [ -d "$GITHUB_WORKSPACE/susfs/kernel_patches/include" ]; then
            echo "Also copying SUSFS headers from local clone as backup..."
            cp -rv "$GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/"* "$KERNEL_DIR/include/linux/"
          fi
          
          # Verify files exist
          echo "Verifying SUSFS header files..."
          find "$KERNEL_DIR/include/linux/" -name "susfs*" -o -name "sus_su*" -type f
          
          # Create necessary symlinks if any required
          ln -sf "$KERNEL_DIR/include/linux/susfs.h" "$KERNEL_DIR/include/susfs.h" || true
          ln -sf "$KERNEL_DIR/include/linux/susfs_def.h" "$KERNEL_DIR/include/susfs_def.h" || true
          
          # Fix LSM audit if it includes susfs_def.h
          if grep -q "linux/susfs_def.h" "$KERNEL_DIR/security/lsm_audit.c" 2>/dev/null; then
            echo "Fixing security/lsm_audit.c to conditionally include susfs_def.h..."
            sed -i '/linux\/susfs_def.h/i\#ifdef CONFIG_KSU_SUSFS' "$KERNEL_DIR/security/lsm_audit.c"
            sed -i '/linux\/susfs_def.h/a\#endif' "$KERNEL_DIR/security/lsm_audit.c"
          fi
          
          
          
      - name: Inject KSU/SUKISU/SUSFS Config Settings into gki_defconfig
        working-directory: kernel
        run: |
          cat << 'EOF' >> arch/x86/configs/gki_defconfig

          # --- Manual KSU/SUSFS Configuration Injection ---
          
          # Core kernel dependencies
          CONFIG_MODULES=y
          CONFIG_KALLSYMS=y
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_MODULE_UNLOAD=y
          
          # KernelSU configurations
          CONFIG_KSU=y
          CONFIG_KSU_FS=y
          CONFIG_KSU_ALLOWLIST=y
          CONFIG_KSU_SUKISU=y
          CONFIG_KSU_DEBUG=y
          CONFIG_KPROBES=y
          CONFIG_KPM=y
          CONFIG_KSU_SUPERCALLS=y
          CONFIG_KSU_ENFORCE=y
          CONFIG_KSU_PERMISSIVE=y
          CONFIG_KSU_CORE_INIT=y
          CONFIG_KSU_KSUD_INIT=y
          CONFIG_KSU_ALLOWLIST_INIT=y
          CONFIG_KSU_GET_ROOT_PROFILE=y
          CONFIG_KSU_MANUAL_HOOK=y
          
          # SUSFS configurations
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          
          # ZRAM configurations
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_LZ4K=y
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_842=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          CONFIG_ZRAM_WRITEBACK=y
          
          # Debug configurations
          CONFIG_DEBUG_KERNEL=y
          CONFIG_DEBUG_INFO=y
          EOF
          
          
          # Manual Injection  of KSU/SUKISU/SUSFS Config Settings into   - 'kernel/arch/x86/configs/x86_64_arcvm_defconfig'
      - name:  Inject KSU/SUKISU/SUSFS Config Settings  - 'kernel/arch/x86/configs/x86_64_arcvm_defconfig'
        working-directory: kernel
        run: |
          cat << 'EOF' >> arch/x86/configs/x86_64_arcvm_defconfig

