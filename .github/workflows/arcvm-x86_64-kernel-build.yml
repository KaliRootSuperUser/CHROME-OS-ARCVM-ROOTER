          CONFIG_KSU_KSUD_INIT=y
          CONFIG_KSU_ALLOWLIST_INIT=y
          CONFIG_KSU_GET_ROOT_PROFILE=y
          CONFIG_KSU_MANUAL_HOOK=y
          
          # SUSFS configurations
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
