          EOF
          
          
          
          
          
          # Manual Injection  of KSU/SUKISU/SUSFS Config Settings into  - 'kernel/arch/x86/configs/x86_64_defconfig'
      - name:  Inject KSU/SUKISU/SUSFS Config Settings  - 'kernel/arch/x86/configs/x86_64_defconfig'
        working-directory: kernel
        run: |
          cat << 'EOF' >> arch/x86/configs/x86_64_defconfig

